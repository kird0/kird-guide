      var idx = -1, word = null;
      hl.forEach(function (w) {
        var i = remaining.indexOf(w);
        if (i !== -1 && (idx === -1 || i < idx)) { idx = i; word = w; }
      });
      if (idx === -1) { pillParts.push(h("span", { key: k++ }, remaining)); break; }
      if (idx > 0) pillParts.push(h("span", { key: k++ }, remaining.slice(0, idx)));
      pillParts.push(h("span", { key: k++, style: { color: "#f0c46b", fontWeight: 800 } }, word));
      remaining = remaining.slice(idx + word.length);
    }
  }
  return h("div", {
    style: {
      background: "linear-gradient(120deg, #16273d 0%, #24365a 45%, #3d2a63 100%)",
      borderRadius: "12px", padding: "22px 20px", marginBottom: "20px",

      kv.title

    (kv.lines || []).map(function (l, i) {

      return h("div", {

          whiteSpace: "pre-line"

    }),
    kv.pill && h("div", {

        padding: "7px 18px", fontSize: "12.5px", color: "rgba(255,255,255,0.9)"
